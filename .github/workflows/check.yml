# TIC weboldal – ellenőrzés minden változásnál.
# Az élő oldalra a tárhely saját ütemezett feladata (tools/server-deploy.sh) húzza le a main ágat
# ötpercenként, ezért itt nincs feltöltés és nincs szükség titkos változóra.
# Ez a lépés csak azt nézi meg, hogy a blog le van-e generálva és az adatfájlok érvényesek-e.
name: Ellenőrzés

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Adatfájlok
        run: python3 -c "import json; [json.load(open(f, encoding='utf-8')) for f in ('data/kiirasok.json', 'data/blog.json', 'data/esemenyek.json')]"
      - name: A blog le van generálva
        run: |
          pip install --quiet markdown
          python3 tools/build_blog.py .
          git diff --stat --exit-code -- blog.html blog index.html calendar.html events.html data/blog.json \
            || { echo "::error::A blog nincs újragenerálva: futtasd a tools/build_blog.py-t és commitold az eredményt"; exit 1; }
      - name: Frissítő szkript szintaxisa
        run: bash -n tools/server-deploy.sh
