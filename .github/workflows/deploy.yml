# TIC weboldal – automatikus feltöltés a ROMARG-tárhelyre (cPanel API).
# Minden main ágra küldött változás után lefut: legenerálja a blogot,
# becsomagolja a weboldal fájljait, feltölti és kicsomagolja a public_html-be.
# Szükséges titkos változó: CPANEL_TOKEN (cPanel › Security › Manage API Tokens).
name: Feltöltés a tárhelyre

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CPANEL_HOST: https://server-0398.whmpanels.com:2083
  CPANEL_USER: r130332tran
  WEBROOT: /home/r130332tran/public_html
  SITE: https://transylvanianinstitute.ro

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Blog generálása, adatfájlok ellenőrzése
        run: |
          pip install --quiet markdown==3.7
          python3 tools/build_blog.py .
          python3 -c "import json; [json.load(open(f, encoding='utf-8')) for f in ('data/kiirasok.json', 'data/blog.json')]"
          printf '{"commit": "%s", "deployed": "%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/version.json

      - name: Csomagolás
        run: |
          zip -r -X site.zip index.html calendar.html blog.html blog assets data
          unzip -l site.zip | tail -1

      - name: Feltöltés és kicsomagolás
        env:
          CPANEL_TOKEN: ${{ secrets.CPANEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CPANEL_TOKEN}" ]; then echo "::error::Hiányzik a CPANEL_TOKEN titkos változó"; exit 1; fi
          AUTH="Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}"
          NAME="site-${GITHUB_SHA::8}.zip"
          check() { python3 -c "import sys,json; d=json.load(sys.stdin); ok=d.get('status')==1 or d.get('cpanelresult',{}).get('event',{}).get('result')==1; print('$1', 'OK' if ok else d); sys.exit(0 if ok else 1)"; }
          api2() { curl -sS --fail-with-body -m 180 -H "$AUTH" "$CPANEL_HOST/json-api/cpanel" \
                     --data-urlencode cpanel_jsonapi_apiversion=2 --data-urlencode cpanel_jsonapi_module=Fileman \
                     --data-urlencode cpanel_jsonapi_func=fileop "$@"; }
          curl -sS --fail-with-body -m 300 -H "$AUTH" -F "dir=$WEBROOT" -F "overwrite=1" \
               -F "file-1=@site.zip;filename=$NAME" "$CPANEL_HOST/execute/Fileman/upload_files" | check feltöltés
          api2 --data-urlencode op=extract --data-urlencode "sourcefiles=$WEBROOT/$NAME" --data-urlencode "destfiles=$WEBROOT" | check kicsomagolás
          api2 --data-urlencode op=unlink --data-urlencode "sourcefiles=$WEBROOT/$NAME" | check takarítás

      - name: Ellenőrzés az élő oldalon
        run: |
          sleep 5
          live=$(curl -sS "$SITE/data/version.json?n=$RANDOM")
          echo "$live"
          echo "$live" | grep -q "$GITHUB_SHA" || { echo "::error::Az élő oldalon nem az új változat van"; exit 1; }
          for f in index.html calendar.html blog.html data/kiirasok.json; do
            a=$(curl -sS "$SITE/$f?n=$RANDOM" | sha256sum | cut -c1-16); b=$(sha256sum < "$f" | cut -c1-16)
            [ "$a" = "$b" ] && echo "OK $f" || { echo "::error::Eltér: $f"; exit 1; }
          done
